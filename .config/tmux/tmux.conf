set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum' # Saves session every 15 minutes
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dracula/tmux'

# theme
set -g @dracula-show-battery-status true
set -g @dracula-plugins 'cpu-usage ram-usage'
set -g @dracula-cpu-usage-colors 'yellow dark_gray'
set -g @dracula-ram-usage-colors 'cyan dark_gray'
set -g @dracula-cpu-usage-label '💻'
set -g @dracula-ram-usage-label '🧠'
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g status-position top

set -g prefix C-b

# panes
bind -r k resize-pane -U 5
bind -r j resize-pane -D 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5

# scrolling
bind -T copy-mode u send -X halfpage-up
bind -T copy-mode d send -X halfpage-down

unbind r
bind r source-file ~/dotfiles/.config/tmux/tmux.conf \; display-message "Config reloaded"

# mouse
set -g mouse on

# shell
set -g default-shell /bin/zsh
set -g default-command "zsh -l"

run -b '~/.tmux/plugins/tpm/tpm'
